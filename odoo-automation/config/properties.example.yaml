# One block per hotel.  Copy to properties.yaml and edit.
#   code:             short property code used in journal refs and log files
#   pms:              PEP | AGILYSYS | HOTELKEY | OPERA | CHOICEADV | SYNXIS
#   pms_property_id:  id printed on the report (PEP "Hotel ID", choiceADVANTAGE "Property Code",
#                     HotelKey header code) - lets `batch` route a file to the right property
#   gl_mapping:       YAML with report-label -> GL account rules (relative to this folder)
#   excel_template:   optional cell map for the GM spreadsheet (interim input)
#   company:          Odoo company name if the database is multi-company
properties:
  - code: OKCON
    name: Embassy Suites by Hilton Oklahoma City Northwest
    brand: Hilton
    pms: PEP
    pms_property_id: OKCON
    company: Example Hotel LLC
    gl_mapping: gl_mapping/hilton_pep.example.yaml

  - code: TXI47
    name: Comfort Inn Wichita Falls near University
    brand: Choice
    pms: CHOICEADV
    pms_property_id: TXI47
    company: Example Hotel LLC
    gl_mapping: gl_mapping/choice_advantage.example.yaml

  - code: OKCMD
    name: Holiday Inn Express & Suites Oklahoma City Airport
    brand: IHG
    pms: HOTELKEY
    pms_property_id: OKCMD
    company: Example Hotel LLC
    gl_mapping: gl_mapping/ihg_hotelkey.example.yaml

  - code: CANDLEWOOD-MOORE
    name: Candlewood Suites Moore Oklahoma
    brand: IHG
    pms: OPERA
    pms_property_name: Candlewood Suites Moore Oklahoma   # OPERA prints no id, match on name
    company: Example Hotel LLC
    gl_mapping: gl_mapping/ihg_opera.example.yaml

  - code: CY-EXAMPLE
    name: Courtyard Example (no sample report yet)
    brand: Marriott
    pms: AGILYSYS
    gl_mapping: gl_mapping/marriott_agilysys.example.yaml

  - code: LQ-EXAMPLE
    name: La Quinta Example (no sample report yet)
    brand: Wyndham
    pms: SYNXIS
    gl_mapping: gl_mapping/wyndham_synxis.example.yaml
