{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block body %}
<div class="card" style="max-width:380px">
  <h1>Log in</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login" style="display:flex;flex-direction:column;gap:10px">
    <label>Username <input id="username" name="username" autocomplete="username" required></label>
    <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="small"><a href="/forgot">Forgotten your password?</a></p>
</div>
{% endblock %}
