{% extends "base.html" %}{% block title %}Two-step sign-in{% endblock %}
{% block body %}
<div class="card" style="max-width:380px">
  <h1>Enter your code</h1>
  <p class="small">Open your authenticator app and type the six digits it shows for Night Audit.</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login/mfa" style="display:flex;flex-direction:column;gap:10px">
    <input type="hidden" name="pending" value="{{ pending }}">
    <label>Six-digit code
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*"
             maxlength="9" required autofocus></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="small"><a href="/login">Start again</a></p>
</div>
{% endblock %}
