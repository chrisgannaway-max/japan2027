{% extends "base.html" %}{% block title %}{{ 'New property' if is_new else prop.code }}{% endblock %}
{% block body %}
<h1>{{ 'New property' if is_new else prop.code }}</h1>
{% if err %}<p class="err">{{ err }}</p>{% endif %}
<div class="card">
  <form method="post" action="/admin/properties/{{ 'new' if is_new else prop.code }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">
    <label>Code (used in logins and journal refs) <input id="p_code" name="code" value="{{ prop.code }}" {% if not is_new %}readonly{% endif %} required></label>
    <label>Name <input id="p_name" name="name" value="{{ prop.name }}"></label>
    <label>Brand <input id="p_brand" name="brand" value="{{ prop.brand }}"></label>
    <label>PMS <select id="p_pms" name="pms">{% for k in ['PEP','CHOICEADV','HOTELKEY','OPERA','AGILYSYS','SYNXIS','GENERIC'] %}<option value="{{ k }}" {% if prop.pms == k %}selected{% endif %}>{{ k }}</option>{% endfor %}</select></label>
    <label>Id printed on the report <input id="p_pid" name="pms_property_id" value="{{ prop.pms_property_id }}" placeholder="OKCON / TXI47 / 89051"></label>
    <label>Name printed on the report <input id="p_pname" name="pms_property_name" value="{{ prop.pms_property_name }}" placeholder="for OPERA / Agilysys"></label>
    <label>Odoo company <input id="p_company" name="company" value="{{ prop.company }}"></label>
    <label>Analytic account <input id="p_analytic" name="analytic" value="{{ prop.analytic }}"></label>
    <label>Journal code <input id="p_journal" name="journal" value="{{ prop.journal }}" placeholder="NA"></label>
    <label><input type="checkbox" id="p_enabled" name="enabled" value="1" {% if prop.enabled %}checked{% endif %}> enabled</label>
    <label style="grid-column:1/-1">GL mapping (YAML, same format as config/gl_mapping/*.yaml)
      <textarea id="p_mapping" name="mapping_yaml" rows="22" style="width:100%;font-family:ui-monospace,monospace;font-size:.85rem">{{ prop.mapping_yaml }}</textarea></label>
    <div class="row" style="grid-column:1/-1">
      <button class="btn" type="submit">Save</button>
      {% if not is_new %}<button class="btn secondary" type="submit" name="action" value="delete" onclick="return confirm('Delete this property?')">Delete</button>{% endif %}
      <a class="btn secondary" href="/admin">Back</a>
    </div>
  </form>
</div>
{% endblock %}
